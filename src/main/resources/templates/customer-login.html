<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="ISO-8859-1">
<title>Customer Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
    background: #642B73; 
    background: -webkit-linear-gradient(to right, #C6426E, #642B73); 
    background: linear-gradient(to right, #C6426E, #642B73);
  }
  #loginbox {
    border: none;
    padding: 30px;
    width: 90%;
    max-width: 400px;
    background: black;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    border-radius: 15px;
    color: white;
  }
  h1 {
    text-align: center;
    color: green;
    margin-bottom: 20px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  label {
    font-weight: 600;
    color: white;
  }
  input {
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    outline: none;
  }
  input::placeholder {
    color: white;
  }
  button {
    background: green;
    color: white;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background: darkgreen;
  }
  .message h3 {
    color: #ff4d4d;
  }
  .message h4 {
    color: #4dff88;
  }
  .footer {
    margin-top: 15px;
    font-size: 16px;
    text-align: center;
  }
  .footer a {
    text-decoration: none;
    font-weight: bold;
    color: green;
  }
  .footer a:hover {
    color: darkgreen;
  }
</style>
</head>
<body>
<div id="loginbox">
  <h1>Customer Login</h1>
  <div class="message">
    <h3 th:text="${session.fail}"></h3>
    <h4 th:text="${session.pass}"></h4>
    <th:block th:text="${@myService.removeMessage()}"></th:block>
  </div>
  <form action="/customer-login" method="post">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Login</button>
  </form>
  <div class="footer">
    <h2>Are you a Seller? <a href="/seller-login">Click here</a></h2>
  </div>
</div>
</body>
</html>
